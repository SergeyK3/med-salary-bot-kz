version: "3.9"

services:
  api:
    build:
      context: ..
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=${TZ}
    volumes:
      - ../data:/app/data:ro
    expose:
      - "8000"
    restart: unless-stopped

  bot:
    build:
      context: ..
    command: python -m telegram_bot.main
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=${TZ}
    volumes:
      - ../data:/app/data:ro
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
